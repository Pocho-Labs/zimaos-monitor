name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Set version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Validate version tag
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Invalid release tag: ${VERSION}" >&2
            echo "Expected vX.Y.Z or vX.Y.Z-rc.N" >&2
            exit 1
          fi

      - name: Validate tag source branch
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          TAG_COMMIT="$(git rev-list -n 1 "${VERSION}")"
          if [[ "${VERSION}" == *"-rc."* ]]; then
            RELEASE_VERSION="${VERSION#v}"
            RELEASE_VERSION="${RELEASE_VERSION%%-rc.*}"
            TARGET_REF="origin/release/${RELEASE_VERSION}"
            git show-ref --verify --quiet "refs/remotes/${TARGET_REF}" || {
              echo "Release branch ${TARGET_REF} does not exist" >&2
              exit 1
            }
          else
            TARGET_REF="origin/main"
          fi

          if ! git merge-base --is-ancestor "${TAG_COMMIT}" "${TARGET_REF}"; then
            echo "Tag ${VERSION} is not part of ${TARGET_REF}" >&2
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Build Linux amd64
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o bin/zimaos-monitor \
            ./cmd/zimaos-monitor

      - name: Verify binary version
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: test "$(bin/zimaos-monitor --version)" = "${VERSION}"

      - name: Package tarball
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          STAGING="zimaos-monitor-${VERSION}-linux-amd64"
          mkdir -p "${STAGING}"
          cp bin/zimaos-monitor "${STAGING}/"
          cp config.example.yaml "${STAGING}/config.yaml"
          cp systemd/zimaos-monitor.service "${STAGING}/"
          install -m755 scripts/install.sh "${STAGING}/"
          tar -czf "${STAGING}.tar.gz" "${STAGING}"
          sha256sum "${STAGING}.tar.gz" > "${STAGING}.tar.gz.sha256"

      - name: Detect pre-release
        id: prerelease
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          if [[ "${VERSION}" == *"-beta"* || "${VERSION}" == *"-rc"* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.prerelease.outputs.IS_PRERELEASE }}
          generate_release_notes: true
          files: |
            zimaos-monitor-${{ steps.version.outputs.VERSION }}-linux-amd64.tar.gz
            zimaos-monitor-${{ steps.version.outputs.VERSION }}-linux-amd64.tar.gz.sha256
